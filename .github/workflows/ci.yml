name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff bandit
      - name: Ruff lint
        run: ruff check app/ scripts/ tests/ clients/python/
      - name: Ruff format check
        run: ruff format --check app/ scripts/ tests/ clients/python/
      - name: Bandit security scan
        run: bandit -c pyproject.toml -r app/ -q

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install runtime deps
        run: pip install -r requirements.txt
      - name: pip-audit
        # Starlette advisories are ignored explicitly: fixes require
        # starlette>=1.x, which FastAPI does not support yet. Re-check on
        # every FastAPI release; everything else must be clean.
        run: |
          pip install pip-audit
          pip-audit \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-2280

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
      - name: Run tests with coverage
        # floor is intentionally below current (~75%) — line counting
        # differs slightly between 3.9/3.12; raise as coverage grows
        run: pytest tests/ -q --cov=app --cov-fail-under=72

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t public-transit-api .
      - name: Smoke-run image
        run: |
          docker run -d --name api -p 8000:8000 public-transit-api
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          docker rm -f api
